[package]
name = "edge-notes"
version = "0.0.2"
description = "Edge-docked notes widget"
edition = "2024"
rust-version = "1.85"

[lib]
name = "edge_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["image-png", "macos-private-api", "tray-icon"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v7"] }
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-log = "2.9.1"
log = "0.4.34"
tauri-plugin-notification = "2.4.0"

# Pinned per build brief section 13: community git dependency, isolated in platform/macos.rs.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
