# Builds the Linux and Windows packages for a release and attaches them to it,
# then publishes both to the public Pages site
# (github.com/prasenjithiwale/edge-notes-apt, named before the app was): the .deb into the signed APT
# repository, the Windows installers as direct downloads. This repository is
# private, so its Releases page is not a public download — the Pages site is.
#
# Tauri can only bundle for the platform it runs on, so neither can be built on a
# Mac; these runners do it. The macOS build is made locally and uploaded to the
# same release (see "Releasing" in the README).
#
# Runs for both platforms when a version tag (v0.0.1, v1.2.3 ...) is pushed, or
# by hand from the Actions tab for an existing tag and the platforms chosen there.
# Either way the code built is the tag's, so every file in a release comes from
# the same commit.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.0.1"
        required: true
      platforms:
        description: "What to run: any of linux, windows, publish"
        required: true
        default: "linux windows publish"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  # Idea 6: the updater's key signs every file the app may install itself. The
  # key has no password; the secret is what protects it. Updater files are
  # asked for on the command line rather than in tauri.conf.json, so a local
  # build without the key still works.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
  UPDATER_CONFIG: '{"bundle":{"createUpdaterArtifacts":true}}'

jobs:
  prepare:
    name: Release exists
    runs-on: ubuntu-latest
    steps:
      # Created once, here, so the platform jobs running side by side cannot each
      # start their own draft. Normally the macOS build has created it already.
      - name: Start a draft release if there is none
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag \
              --title "Ledge $TAG" --notes "Draft: builds in progress."

  linux:
    name: Linux x86_64
    needs: prepare
    if: github.event_name == 'push' || contains(github.event.inputs.platforms, 'linux')
    # The oldest supported runner, so the packages link against a glibc old
    # enough for Ubuntu 22.04 and newer (brief 5).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the app version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Test
        run: |
          npm run lint
          npm test
          cd src-tauri && cargo test

      - name: Build .deb and .AppImage
        run: npm run tauri build -- --bundles deb,appimage --config "$UPDATER_CONFIG"

      - name: Attach to the release
        run: |
          version="${TAG#v}"
          bundle=src-tauri/target/release/bundle
          mkdir -p out
          cp "$bundle"/deb/*.deb "out/Ledge_${version}_linux_amd64.deb"
          cp "$bundle"/appimage/*.AppImage "out/Ledge_${version}_linux_x86_64.AppImage"
          cp "$bundle"/appimage/*.AppImage.sig "out/Ledge_${version}_linux_x86_64.AppImage.sig"
          gh release upload "$TAG" out/* --clobber

  windows:
    name: Windows x64
    needs: prepare
    if: github.event_name == 'push' || contains(github.event.inputs.platforms, 'windows')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Windows runners check files out with CRLF line endings by default, which
      # the tests that read source files as text (tokens.css, Cargo.toml) do not
      # expect. Keep them exactly as committed.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the app version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # SQLCipher builds OpenSSL from source, and OpenSSL's build is Perl. These
      # steps run in bash, so the MSYS perl that comes with Git for Windows is
      # first on PATH — and that one is missing Locale::Maketext::Simple, so the
      # build dies before it compiles a line of C. Strawberry Perl is on the
      # image and is the one openssl-src expects; `PERL` is what it reads.
      - name: Point OpenSSL's build at Strawberry Perl
        run: |
          perl="C:\\Strawberry\\perl\\bin\\perl.exe"
          "$perl" -e 'use Locale::Maketext::Simple; print "strawberry perl is complete\n"'
          echo "PERL=$perl" >> "$GITHUB_ENV"
          echo "OPENSSL_SRC_PERL=$perl" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Test
        run: |
          npm run lint
          npm test
          cd src-tauri && cargo test

      # NSIS for the familiar setup.exe, WiX for an .msi that IT departments can
      # deploy. Tauri downloads both tools itself. The installer fetches WebView2
      # if a machine lacks it (Windows 10 before it shipped by default).
      - name: Build setup.exe and .msi
        run: npm run tauri build -- --bundles nsis,msi --config "$UPDATER_CONFIG"

      - name: Attach to the release
        run: |
          version="${TAG#v}"
          bundle=src-tauri/target/release/bundle
          mkdir -p out
          cp "$bundle"/nsis/*-setup.exe "out/Ledge_${version}_windows_x64-setup.exe"
          cp "$bundle"/msi/*.msi "out/Ledge_${version}_windows_x64.msi"
          cp "$bundle"/nsis/*-setup.exe.sig "out/Ledge_${version}_windows_x64-setup.exe.sig"
          cp "$bundle"/msi/*.msi.sig "out/Ledge_${version}_windows_x64.msi.sig"
          gh release upload "$TAG" out/* --clobber
  publish:
    name: Pages site
    needs: [prepare, linux, windows]
    # After the platform builds, or on its own from a manual run, taking the
    # files already attached to the release. One job, so the two kinds of package
    # cannot race each other pushing to the site repository. It only waits for the
    # Windows job rather than requiring it: a broken Windows build should not also
    # keep the .deb out of the APT repository, and the steps below publish
    # whatever the release actually has.
    # "apt" is still accepted as the platform name this job used to have.
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (github.event_name == 'push' ||
      contains(github.event.inputs.platforms, 'publish') ||
      contains(github.event.inputs.platforms, 'apt'))
    runs-on: ubuntu-24.04
    env:
      SITE_URL: https://prasenjithiwale.github.io/edge-notes-apt
    steps:
      # The publishing scripts come from the workflow's own commit rather than the
      # tag, so an older release can be published with the current scripts.
      - uses: actions/checkout@v4
        with:
          path: source

      - name: Fetch the release's packages
        run: |
          gh release download "$TAG" --dir incoming \
            --pattern "*.deb" \
            --pattern "*macOS_universal.dmg" \
            --pattern "*windows_x64-setup.exe" \
            --pattern "*windows_x64.msi" \
            --pattern "*.sig" \
            --pattern "*macOS_universal.app.tar.gz" \
            --pattern "*linux_x86_64.AppImage"
          ls -l incoming

      - uses: actions/checkout@v4
        with:
          repository: prasenjithiwale/edge-notes-apt
          ssh-key: ${{ secrets.APT_DEPLOY_KEY }}
          path: apt

      - name: Import the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::the APT_SIGNING_KEY secret is missing"
            exit 1
          fi
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import

      - name: Add the .deb and sign the index
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils
          source/tools/publish_apt.sh apt incoming/*.deb

      # Releases made before this job published Windows have no such assets; the
      # site keeps whatever it already has rather than failing the run.
      - name: Add the Windows installers
        run: |
          shopt -s nullglob
          installers=(incoming/*windows_x64*)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "$TAG has no Windows installers; leaving the site's as they are."
            exit 0
          fi
          source/tools/publish_windows.sh apt "${installers[@]}"

      # The macOS build is made by hand on a Mac and attached to the release, so a
      # run may legitimately find none — the same as for Windows.
      - name: Add the macOS disk image
        run: |
          shopt -s nullglob
          images=(incoming/*macOS_universal.dmg)
          if [ ${#images[@]} -eq 0 ]; then
            echo "$TAG has no macOS disk image; leaving the site's as it is."
            exit 0
          fi
          source/tools/publish_macos.sh apt "${images[@]}"

      # Idea 6: the feed installed copies ask for new versions. After the
      # installers, before the push, so the feed and its files land together.
      - name: Write the updater feed
        run: source/tools/publish_updates.sh apt "$SITE_URL" "${TAG#v}" incoming

      - name: Write the landing page
        run: source/tools/render_site.sh apt

      - name: Publish
        working-directory: apt
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The site already has this release."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "edge-notes ${TAG#v}"
          git push

      # After the site push, never before it: the cask pins a sha256 for a url on
      # that site, so publishing the cask first would advertise a download that
      # is not there yet.
      - uses: actions/checkout@v4
        with:
          repository: prasenjithiwale/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Update the Homebrew cask
        run: |
          shopt -s nullglob
          images=(incoming/*macOS_universal.dmg)
          if [ ${#images[@]} -eq 0 ]; then
            echo "$TAG has no macOS disk image; leaving the cask as it is."
            exit 0
          fi
          source/tools/publish_cask.sh tap "${images[0]}"
          # Homebrew is not on this runner, so this is the cheap half of `brew
          # audit`: a cask that does not parse breaks `brew tap` for everyone.
          ruby -c tap/Casks/edge-notes.rb
          cd tap
          git add -A
          if git diff --cached --quiet; then
            echo "The tap already has this release."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "edge-notes ${TAG#v}"
          git push

      # The cask's own two claims, checked against the live site: that the file
      # it points at is downloadable by anyone, and that the sha256 it pins is
      # that file's. `brew install` would fail on either, and this repository has
      # no macOS runner to find that out the expensive way.
      - name: Check the cask against the live site
        run: |
          if [ ! -f tap/Casks/edge-notes.rb ]; then
            echo "No cask to check."
            exit 0
          fi
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' tap/Casks/edge-notes.rb)
          want=$(sed -n 's/^  sha256 "\(.*\)"$/\1/p' tap/Casks/edge-notes.rb)
          name="Ledge_${version}_macOS_universal.dmg"
          # Pages can take a couple of minutes to serve a push, and this step is
          # the first thing to touch the new deploy, so it waits like the APT
          # check below rather than relying on curl's own retries.
          for attempt in $(seq 1 40); do
            if curl -fsSL -o live.dmg "$SITE_URL/macos/$name"; then
              break
            fi
            echo "Waiting for GitHub Pages to serve $name ($attempt)"
            sleep 15
          done
          echo "$want  live.dmg" | sha256sum -c -

      # The real proof: install from the live repository, as a user would, on
      # the Ubuntu release current Kubuntu is built on.
      - name: Install from the published repository
        run: |
          version="${TAG#v}"
          for attempt in $(seq 1 40); do
            if curl -fsS "$SITE_URL/dists/stable/main/binary-amd64/Packages" | grep -qx "Version: $version"; then
              break
            fi
            echo "Waiting for GitHub Pages to serve $version ($attempt)"
            sleep 15
          done
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL "$SITE_URL/key.gpg" | sudo gpg --batch --dearmor -o /etc/apt/keyrings/ledge.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/ledge.gpg] $SITE_URL stable main" \
            | sudo tee /etc/apt/sources.list.d/ledge.list
          sudo apt-get update
          apt-cache policy ledge
          sudo apt-get install -y "ledge=$version"
          installed="$(dpkg-query --show --showformat='${Version}' ledge)"
          echo "installed ledge $installed"
          test "$installed" = "$version"
          test -x /usr/bin/ledge

      # And the same proof for Windows: everything the page offers, plus anything
      # this release added, is downloaded from the live site and checked against
      # the published sums. The two lists can differ — re-publishing an older tag
      # leaves the page rightly linking the newer version.
      - name: Download the Windows installers from the site
        working-directory: apt
        run: |
          version="${TAG#v}"
          shopt -s nullglob
          wanted=$(
            {
              grep -oE 'windows/[^"]+\.(exe|msi)' index.html
              printf '%s\n' windows/*_"$version"_*
            } | sort -u
          )
          if [ -z "$wanted" ]; then
            echo "No Windows installers to check."
            exit 0
          fi
          curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors \
            -o ../live-SHA256SUMS "$SITE_URL/windows/SHA256SUMS"
          diff ../live-SHA256SUMS windows/SHA256SUMS
          mkdir -p ../check
          : > ../check/SHA256SUMS
          for path in $wanted; do
            name=$(basename "$path")
            curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors \
              -o "../check/$name" "$SITE_URL/windows/$name"
            # Fails the run if the page links something that is not published.
            grep " $name\$" windows/SHA256SUMS >> ../check/SHA256SUMS
            echo "fetched $name"
          done
          cd ../check && sha256sum -c SHA256SUMS
